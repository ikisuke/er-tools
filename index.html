<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='6' height='10' rx='1' fill='%232563eb'/%3E%3Crect x='9' y='3' width='6' height='10' rx='1' fill='%2393c5fd'/%3E%3Cpath d='M7 8h2' stroke='%231e3a8a'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ER ビューア</title>
  </head>
  <body>
    <header class="topbar">
      <h1 class="title">ER ビューア</h1>
      <label class="group-picker">
        <span>グループ</span>
        <select id="group-select" disabled>
          <option>読み込み中…</option>
        </select>
      </label>
      <p class="legend">
        <span class="legend-swatch" aria-hidden="true"></span>
        点線枠の表は他のグループで定義されています。押すと定義している図へ移動します。
      </p>
    </header>
    <div id="warnings" class="warnings" hidden></div>
    <main id="viewport" class="viewport" tabindex="-1">
      <div id="status" class="status">図を読み込んでいます…</div>
      <div id="diagram" class="diagram"></div>
    </main>

    <dialog id="chooser" class="chooser">
      <form method="dialog">
        <h2 id="chooser-title"></h2>
        <p>同じ名前の表が複数のグループで定義されています。移動先のグループを選んでください。</p>
        <ul id="chooser-options" class="chooser-options"></ul>
        <div class="chooser-actions">
          <button value="cancel" class="secondary">キャンセル</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
