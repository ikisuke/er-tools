<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF3670'/%3E%3Crect x='6' y='8' width='8' height='16' rx='2' fill='%23fff'/%3E%3Crect x='18' y='8' width='8' height='16' rx='2' fill='%23FFD6E3'/%3E%3Cpath d='M14 16h4' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ER ビューア</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" />
          <rect x="6" y="8" width="8" height="16" rx="2" class="brand-a" />
          <rect x="18" y="8" width="8" height="16" rx="2" class="brand-b" />
          <path d="M14 16h4" class="brand-line" />
        </svg>
        <h1 class="title">ER ビューア</h1>
      </div>
      <label class="group-picker">
        <span class="group-picker-label">グループ</span>
        <span class="select-wrap">
          <select id="group-select" disabled>
            <option>読み込み中…</option>
          </select>
        </span>
      </label>
      <p class="legend">
        <span class="legend-swatch" aria-hidden="true"></span>
        点線枠の表は他のグループで定義されています。押すと定義している図へ移動します。
      </p>
    </header>
    <div id="warnings" class="warnings" hidden></div>
    <main id="viewport" class="viewport" tabindex="-1">
      <section class="canvas-card">
        <header class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="7" height="6" rx="1.5" />
            <rect x="14" y="14" width="7" height="6" rx="1.5" />
            <path d="M6.5 10v4.5a2 2 0 0 0 2 2H14" />
          </svg>
          <h2 id="card-title" class="card-title">—</h2>
          <span id="card-file" class="card-file"></span>
          <span class="card-mode">読み取り専用</span>
        </header>
        <div id="status" class="status">図を読み込んでいます…</div>
        <div id="stage" class="stage">
          <div id="diagram" class="diagram"></div>
          <div class="zoom-controls" role="toolbar" aria-label="拡大縮小">
            <button type="button" id="zoom-out" title="縮小（ホイールを手前に回しても縮小できます）">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M8 11h6M16 16l4 4" /></svg>
              <span>縮小</span>
            </button>
            <span id="zoom-level" class="zoom-level" aria-live="polite">100%</span>
            <button type="button" id="zoom-in" title="拡大（ホイールを奥に回しても拡大できます）">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M8 11h6M11 8v6M16 16l4 4" /></svg>
              <span>拡大</span>
            </button>
            <span class="zoom-divider" aria-hidden="true"></span>
            <button type="button" id="zoom-fit" title="図全体が収まるように表示">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
              <span>全体表示</span>
            </button>
          </div>
          <p class="stage-hint">ホイールで拡大縮小・ドラッグで移動・点線の下線の列（enum）を押すと値を表示</p>
          <div id="enum-popover" class="enum-popover" role="dialog" aria-labelledby="enum-popover-title" hidden>
            <div class="enum-popover-header">
              <span class="enum-popover-kicker">enum の値</span>
              <button type="button" class="enum-popover-close" aria-label="閉じる">×</button>
            </div>
            <h3 id="enum-popover-title" class="enum-popover-title"></h3>
            <p class="enum-popover-meta"></p>
            <ul class="enum-values"></ul>
            <p class="enum-popover-source"></p>
          </div>
        </div>
      </section>
    </main>

    <dialog id="chooser" class="chooser" aria-labelledby="chooser-title">
      <form method="dialog">
        <h2 id="chooser-title"></h2>
        <p>同じ名前の表が複数のグループで定義されています。移動先のグループを選んでください。</p>
        <ul id="chooser-options" class="chooser-options"></ul>
        <div class="chooser-actions">
          <button value="cancel" class="secondary">キャンセル</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
